name: ISH execution-ticket native build

on:
  push:
    branches: [fix/ish-execution-ticket-recovery-20261020]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ish-execution-ticket-native-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
  EXPECTED_XCODE: "Xcode 26.2"
  EXPECTED_XCODE_BUILD: "Build version 17C52"
  EXPECTED_IOS_SDK: "26.2"
  EXPECTED_ISH: "e6521d9cfe9cd48f19917fc3b23aea622ba358b4"

jobs:
  native-build:
    name: Native lifecycle tests and iOS app compile
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          fetch-depth: 1

      - name: Pin Xcode and iOS SDK
        run: |
          set -euo pipefail
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.txt"
          grep -Fx "$EXPECTED_XCODE" "$RUNNER_TEMP/xcode-version.txt"
          grep -Fx "$EXPECTED_XCODE_BUILD" "$RUNNER_TEMP/xcode-version.txt"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "$EXPECTED_IOS_SDK"

      - name: Initialize pinned iSH source
        run: |
          set -euo pipefail
          git submodule update --init --recursive deps/ish
          test "$(git -C deps/ish rev-parse HEAD)" = "$EXPECTED_ISH"

      - name: Restore native build dependencies
        id: native-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps/libs
            deps/include
            deps/frameworks
            deps/resources
            deps/lame-build
            vendor/RealTimeCutVADLibrary/Frameworks
          key: native-macos26-xcode262-${{ env.EXPECTED_ISH }}-${{ hashFiles('deps/build_lame.sh','deps/build_ffmpeg.sh','deps/build_ish.sh','deps/prepare_alpine_rootfs.sh','deps/build_rclone_ios.sh','deps/build_vad_framework.sh','deps/rclone-mobile/go.sum') }}

      - name: Install native build tools
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          brew install llvm lld libarchive pkg-config meson
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:$PATH"
          command -v meson
          command -v ninja
          command -v /opt/homebrew/opt/llvm/bin/clang
          command -v ld.lld

      - name: Setup Go 1.25
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.25.0"
          cache-dependency-path: deps/rclone-mobile/go.sum

      - name: Build native iOS dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:$PATH"
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh
          ./deps/build_vad_framework.sh

      - name: Save native dependency cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps/libs
            deps/include
            deps/frameworks
            deps/resources
            deps/lame-build
            vendor/RealTimeCutVADLibrary/Frameworks
          key: native-macos26-xcode262-${{ env.EXPECTED_ISH }}-${{ hashFiles('deps/build_lame.sh','deps/build_ffmpeg.sh','deps/build_ish.sh','deps/prepare_alpine_rootfs.sh','deps/build_rclone_ios.sh','deps/build_vad_framework.sh','deps/rclone-mobile/go.sum') }}

      - name: Prepare provider customization
        run: |
          set -euo pipefail
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig

      - name: Native production lifecycle regression
        run: |
          set -euo pipefail
          bash scripts/test_ish_command_lifecycle.sh 2>&1 | tee "$RUNNER_TEMP/ish-lifecycle-tests.log"

      - name: Host production identity and cleanup-helper tests
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/test-venv"
          "$RUNNER_TEMP/test-venv/bin/pip" install --disable-pip-version-check tree-sitter==0.25.2 tree-sitter-swift==0.7.3
          mkdir -p "$RUNNER_TEMP/ish-ticket"
          "$RUNNER_TEMP/test-venv/bin/python" scripts/test_ish_execution_identity.py --out "$RUNNER_TEMP/ish-ticket/backend"
          "$RUNNER_TEMP/test-venv/bin/python" scripts/verify_ish_ticket_integration.py --out "$RUNNER_TEMP/ish-ticket/static"

      - name: Build real Minis iOS app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-build"
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/ios-build/xcodebuild.log"

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ish-execution-ticket-native-build
          path: |
            ${{ runner.temp }}/xcode-version.txt
            ${{ runner.temp }}/ish-lifecycle-tests.log
            ${{ runner.temp }}/ish-ticket/**
            ${{ runner.temp }}/ios-build/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
