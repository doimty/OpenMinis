# Functional candidate profile. Device acceptance is not implied by build success.
name: ios15-height-repair-device

on:
  workflow_dispatch:
  push:
    branches: [fix/ios15-height-policy-candidate]
    paths:
      - .github/workflows/ios15-height-repair-device.yml
      - scripts/ios15-height-policy/**
      - src/ios/Agent/MessageList/MessageListLayout.swift
      - scripts/ios15-provisional-height-probe/DeviceProbe.swift

permissions:
  contents: read

concurrency:
  group: ios15-height-repair-device-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
  EXPECTED_XCODE: "Xcode 26.2"
  EXPECTED_XCODE_BUILD: "Build version 17C52"
  EXPECTED_IOS_SDK: "26.2"
  EXPECTED_ISH: "3f6384c70eefd1a370f121d3492a5f21f7767df9"
  NATIVE_CXX_SHA: 1648fc13a04a90521a2ef3887885ef2506208605
  ONNX_URL: https://github.com/helloooideeeeea/RealTimeCutVADLibraryForXCFramework/releases/download/v1.0.0/onnxruntime.xcframework.zip
  ONNX_SHA256: 498ba860229e0ce45e6983ce44478a836b0c0763451ed37a8b1f8e74a8a0dc1f
  APM_URL: https://github.com/helloooideeeeea/RealTimeCutVADLibraryForXCFramework/releases/download/v1.0.0/webrtc_audio_processing.xcframework.zip
  APM_SHA256: 3ee3d36e9207a09fa3133c405f08a49a0d023f173ee5b4a47c047362aba56856

jobs:
  device-candidate:
    name: Full-source height repair candidate (device NOT_RUN)
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: false

      - name: Pin Xcode and SDK
        run: |
          set -euo pipefail
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.txt"
          grep -Fx "$EXPECTED_XCODE" "$RUNNER_TEMP/xcode-version.txt"
          grep -Fx "$EXPECTED_XCODE_BUILD" "$RUNNER_TEMP/xcode-version.txt"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "$EXPECTED_IOS_SDK"

      - name: Preserve the original observation-only baseline gate
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/height-observation-baseline"
          git worktree add --detach "$BASE" b47cb87a33b4991c50396f727e39fb99387bfa60
          (
            cd "$BASE"
            python3 scripts/reentry-diagnostics/test_isolation.py -v
            bash scripts/reentry-diagnostics/run_collector_tests.sh "$RUNNER_TEMP/reentry-collector"
            bash scripts/ios15-provisional-height-probe/run_capture_window_tests.sh "$RUNNER_TEMP/reentry-collector"
            python3 scripts/reentry-diagnostics/test_trace.py -v
          )

      - name: Verify the explicit functional-candidate source profile
        run: |
          set -euo pipefail
          python3 scripts/ios15-height-policy/check_candidate_source.py \
            --output "$RUNNER_TEMP/candidate-source.json"

      - name: Native policy baseline, candidate and compiled ablations
        run: |
          set -euo pipefail
          python3 scripts/ios15-height-policy/run_tests.py \
            --output "$RUNNER_TEMP/height-policy/baseline" \
            --source-rev b47cb87a33b4991c50396f727e39fb99387bfa60 \
            --expected-failures scripts/ios15-height-policy/baseline-failures.json
          python3 scripts/ios15-height-policy/run_tests.py \
            --output "$RUNNER_TEMP/height-policy/candidate"
          python3 scripts/ios15-height-policy/run_tests.py \
            --output "$RUNNER_TEMP/height-policy/precalc-blind" \
            --mutation precalc-blind --expect-failure precalc_shrink_is_deferred \
            --expect-failure precalc_reseed_keeps_pending
          python3 scripts/ios15-height-policy/run_tests.py \
            --output "$RUNNER_TEMP/height-policy/keep-pending" \
            --mutation keep-pending \
            --expect-failure stable_cancels_pending_shrink \
            --expect-failure post_thaw_stable_cancels_pending_shrink \
            --expect-failure deadband_growth_cancels_pending_shrink
          python3 scripts/ios15-height-policy/run_tests.py \
            --output "$RUNNER_TEMP/height-policy/keep-purge-pending" \
            --mutation keep-purge-pending --expect-failure width_purge_drops_new_intermediate_pending

      - name: Tooling and report behavior tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/ios15-height-policy -p 'test_*.py' -v
          python3 scripts/ios15-provisional-height-probe/test_prepare_device_probe.py -v
          python3 scripts/ios15-provisional-height-probe/test_device_report.py -v
          python3 scripts/ios15-provisional-height-probe/test_replay_report.py -v
          python3 scripts/test_ios15_build_log.py -v
          python3 scripts/test_package_ios15_ipa.py -v
          python3 scripts/test_ios15_compat_contract.py -v

      - name: Init pinned iSH
        run: |
          set -euo pipefail
          git submodule update --init --recursive deps/ish
          test "$(git -C deps/ish rev-parse HEAD)" = "$EXPECTED_ISH"

      - name: Restore native device dependencies
        id: native-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps/libs
            deps/include
            deps/frameworks
            deps/resources
            deps/lame-build
            vendor/RealTimeCutVADLibrary/Frameworks
          key: native-macos26-xcode262-${{ env.EXPECTED_ISH }}-${{ hashFiles('deps/build_lame.sh','deps/build_ffmpeg.sh','deps/build_ish.sh','deps/prepare_alpine_rootfs.sh','deps/build_rclone_ios.sh','deps/build_vad_framework.sh','deps/rclone-mobile/go.sum') }}

      - name: Install native build tools
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          brew install llvm lld libarchive pkg-config meson
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:$PATH"
          command -v meson
          command -v ninja
          command -v ld.lld

      - name: Setup pinned Go
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.25.0"
          cache-dependency-path: deps/rclone-mobile/go.sum

      - name: Provider customization template
        run: |
          set -euo pipefail
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig

      - name: Build native device dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:$PATH"
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh
          ./deps/build_vad_framework.sh

      - name: Save native dependency cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps/libs
            deps/include
            deps/frameworks
            deps/resources
            deps/lame-build
            vendor/RealTimeCutVADLibrary/Frameworks
          key: native-macos26-xcode262-${{ env.EXPECTED_ISH }}-${{ hashFiles('deps/build_lame.sh','deps/build_ffmpeg.sh','deps/build_ish.sh','deps/prepare_alpine_rootfs.sh','deps/build_rclone_ios.sh','deps/build_vad_framework.sh','deps/rclone-mobile/go.sum') }}

      - name: Prepare reversible full-source candidate replay overlay
        run: |
          set -euo pipefail
          PROBE_SOURCE="$RUNNER_TEMP/probe-source"
          rsync -a --exclude .git --exclude deps \
            --exclude 'vendor/RealTimeCutVADLibrary/Frameworks' \
            "$GITHUB_WORKSPACE/" "$PROBE_SOURCE/"
          ln -s "$GITHUB_WORKSPACE/deps" "$PROBE_SOURCE/deps"
          ln -s "$GITHUB_WORKSPACE/vendor/RealTimeCutVADLibrary/Frameworks" \
            "$PROBE_SOURCE/vendor/RealTimeCutVADLibrary/Frameworks"
          python3 scripts/ios15-height-policy/prepare_candidate.py sources \
            --root "$PROBE_SOURCE" --repository "$GITHUB_WORKSPACE" \
            --manifest "$RUNNER_TEMP/candidate-overlay.json"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["exactCandidateInverseVerified"])' "$RUNNER_TEMP/candidate-overlay.json")" = True

      - name: Compile complete app components with the candidate policy
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m1"
          set +e
          xcodebuild -project "$RUNNER_TEMP/probe-source/src/ios/Minis.xcodeproj" \
            -scheme Minis -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/m1/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build \
            > "$RUNNER_TEMP/m1/xcodebuild.log" 2>&1
          status=$?
          set -e
          printf 'xcodebuild_exit=%s\n' "$status" | tee "$RUNNER_TEMP/m1/exit.txt"
          python3 scripts/ios15_build_log.py "$RUNNER_TEMP/m1/xcodebuild.log" --output-dir "$RUNNER_TEMP/m1"
          test -s "$RUNNER_TEMP/m1/xcodebuild.log"
          exit "$status"

      - name: Package the isolated repair candidate
        run: |
          set -euo pipefail
          python3 scripts/ios15-height-policy/prepare_candidate.py bundle \
            --app "$RUNNER_TEMP/m1/DerivedData/Build/Products/Debug-iphoneos/Minis.app" \
            --output "$RUNNER_TEMP/probe-app" --commit "$GITHUB_SHA"
          python3 scripts/package_ios15_ipa.py --app "$RUNNER_TEMP/probe-app/Minis.app" \
            --output-dir "$RUNNER_TEMP/ipa" \
            --entitlements "$RUNNER_TEMP/probe-source/scripts/ios15-provisional-height-probe/Probe.entitlements" \
            --ipa-name "Minis-HeightFix-${GITHUB_SHA:0:8}.ipa" --diagnostic-commit "$GITHUB_SHA"
          codesign --verify --deep --strict "$RUNNER_TEMP/ipa/stage/Payload/Minis.app"

      - name: Upload candidate IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minis-ios15-height-repair-candidate
          path: |
            ${{ runner.temp }}/ipa/*.ipa
            ${{ runner.temp }}/ipa/manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Record evidence without claiming device execution
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m1"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'm1'
          data = {
            'commit': os.environ['GITHUB_SHA'],
            'baseline_commit': '2f21e242df71d63576682f8ac61c50a097f3a5ae',
            'xcode': subprocess.check_output(['xcodebuild', '-version'], text=True).splitlines(),
            'iphoneos_sdk': subprocess.check_output(['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'], text=True).strip(),
            'native_execution': 'NOT_RUN',
            'purpose': 'complete production components with one approved height-policy repair; device acceptance pending',
            'overlay_manifest': str(Path(os.environ['RUNNER_TEMP']) / 'candidate-overlay.json'),
            'm1_log_bytes': (out/'xcodebuild.log').stat().st_size if (out/'xcodebuild.log').exists() else 0,
          }
          (out/'versions.json').write_text(json.dumps(data, indent=2)+'\n')
          print(json.dumps(data, indent=2))
          PY

      - name: Upload source, policy and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: height-repair-build-evidence
          path: |
            ${{ runner.temp }}/m1/xcodebuild.log
            ${{ runner.temp }}/m1/exit.txt
            ${{ runner.temp }}/m1/summary.json
            ${{ runner.temp }}/m1/errors.txt
            ${{ runner.temp }}/m1/versions.json
            ${{ runner.temp }}/candidate-source.json
            ${{ runner.temp }}/candidate-overlay.json
            ${{ runner.temp }}/height-policy/**
            ${{ runner.temp }}/reentry-collector/**
          if-no-files-found: warn
          retention-days: 14
