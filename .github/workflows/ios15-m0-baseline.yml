# M0: unchanged upstream compile on a pinned Xcode.
# Do not treat a started workflow as success. Require nonempty logs,
# recorded toolchain versions, and a zero xcodebuild exit.
name: ios15-m0-baseline

on:
  workflow_dispatch:
  push:
    branches: [compat/ios15]

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
  EXPECTED_XCODE: "Xcode 26.2"
  EXPECTED_XCODE_BUILD: "Build version 17C52"
  EXPECTED_IOS_SDK: "26.2"
  EXPECTED_ISH: "3f6384c70eefd1a370f121d3492a5f21f7767df9"

jobs:
  baseline:
    name: Unchanged upstream iOS device build
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          fetch-depth: 1

      - name: Pin Xcode 26.2
        run: |
          set -euo pipefail
          sudo xcode-select -s "$DEVELOPER_DIR"
          test -d "$DEVELOPER_DIR"
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          test "$(printf '%s\n' "$xcode_version" | sed -n '1p')" = "$EXPECTED_XCODE"
          test "$(printf '%s\n' "$xcode_version" | sed -n '2p')" = "$EXPECTED_XCODE_BUILD"
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          printf 'iphoneos SDK %s\n' "$sdk"
          test "$sdk" = "$EXPECTED_IOS_SDK"
          xcrun clang --version
          swift --version

      - name: Init pinned iSH submodule only
        run: |
          set -euo pipefail
          git submodule update --init --recursive deps/ish
          sha="$(git -C deps/ish rev-parse HEAD)"
          printf 'deps/ish %s\n' "$sha"
          test "$sha" = "$EXPECTED_ISH"

      - name: Install native build tools
        run: |
          set -euo pipefail
          brew install llvm libarchive pkg-config meson
          export PATH="/opt/homebrew/opt/llvm/bin:$PATH"
          command -v meson
          command -v ninja
          test -x /opt/homebrew/opt/llvm/bin/clang

      - name: Setup Go 1.25
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.25.0"
          cache-dependency-path: deps/rclone-mobile/go.sum

      - name: Provider customization template
        run: |
          set -euo pipefail
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: Build native iOS dependencies
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/llvm/bin:$PATH"
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh
          ls -ld deps/libs deps/frameworks deps/resources
          find deps/libs deps/frameworks -maxdepth 2 -type f | head

      - name: Compile Minis for generic iOS device
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m0"
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/m0/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            build \
            | tee "$RUNNER_TEMP/m0/xcodebuild.log"

      - name: Record evidence
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          def sha256(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for chunk in iter(lambda: f.read(1024*1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          root=Path(os.environ['GITHUB_WORKSPACE'])
          temp=Path(os.environ['RUNNER_TEMP'])/'m0'
          app=next(temp.glob('DerivedData/Build/Products/Debug-iphoneos/Minis.app'), None)
          log=temp/'xcodebuild.log'
          ev={
            'commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
            'xcode': subprocess.check_output(['xcodebuild','-version'], text=True).strip().splitlines(),
            'iphoneos_sdk': subprocess.check_output(['xcrun','--sdk','iphoneos','--show-sdk-version'], text=True).strip(),
            'swift': subprocess.check_output(['swift','--version'], text=True).strip().splitlines()[0],
            'ish': subprocess.check_output(['git','-C','deps/ish','rev-parse','HEAD'], text=True).strip(),
            'xcodebuild_log_bytes': log.stat().st_size if log.exists() else 0,
            'app_exists': bool(app and app.exists()),
            'app_sha256': sha256(app) if app and app.is_file() else None,
          }
          if app and app.is_dir():
              # Hash the Info.plist as a cheap identity; full .app is a directory.
              info=app/'Info.plist'
              ev['info_plist_sha256']=sha256(info) if info.exists() else None
              ev['app_path']=str(app)
          (temp/'versions.json').write_text(json.dumps(ev, indent=2)+'\n')
          print(json.dumps(ev, indent=2))
          PY

      - name: Upload M0 logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m0-baseline-evidence
          path: |
            ${{ runner.temp }}/m0/xcodebuild.log
            ${{ runner.temp }}/m0/versions.json
          if-no-files-found: warn
          retention-days: 14
