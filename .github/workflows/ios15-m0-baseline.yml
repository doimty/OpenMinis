# M0 already passed on run 35228590640 (Xcode 26.2 / iOS SDK 26.2).
# Push to compat/ios15 now probes IPHONEOS_DEPLOYMENT_TARGET=15.0.
# Re-run the unchanged baseline with workflow_dispatch.
# Do not treat a started workflow as success.
name: ios15-m0-baseline

on:
  workflow_dispatch:
    inputs:
      experimental_broad_files:
        description: 'Also package isolated experimental Minis Files (no root; device unverified)'
        type: boolean
        default: false
      host_file_probe:
        description: 'Build the opt-in host file probe app + root helper (local diagnostics only; nothing is installed)'
        type: boolean
        default: false
  push:
    branches: [ios15/1.15, compat/ios15, fix/ios15-sf-symbols, fix/ios15-input-prompts, fix/ios15-retry-hit, fix/ios15-cell-hit-region, fix/ios15-hang-boundaries, fix/stream-stall-guard, fix/responses-api-args-recovery, fix/ios15-gpt62-attachments-broadfiles-20261120]

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
  EXPECTED_XCODE: "Xcode 26.2"
  EXPECTED_XCODE_BUILD: "Build version 17C52"
  EXPECTED_IOS_SDK: "26.2"
  EXPECTED_ISH: "0fd17a135e78b7a0cf08a4f5831217bbb76ed22f"
  # Pins for the vendored local VAD package's binary (built from C++ source
  # at IPHONEOS_DEPLOYMENT_TARGET=15.0, see deps/build_vad_framework.sh).
  # Checksums are the published values from the wrapper Package.swift tag
  # 1.0.3; the probe workflow independently audits the resulting binary.
  NATIVE_CXX_SHA: 1648fc13a04a90521a2ef3887885ef2506208605
  ONNX_URL: https://github.com/helloooideeeeea/RealTimeCutVADLibraryForXCFramework/releases/download/v1.0.0/onnxruntime.xcframework.zip
  ONNX_SHA256: 498ba860229e0ce45e6983ce44478a836b0c0763451ed37a8b1f8e74a8a0dc1f
  APM_URL: https://github.com/helloooideeeeea/RealTimeCutVADLibraryForXCFramework/releases/download/v1.0.0/webrtc_audio_processing.xcframework.zip
  APM_SHA256: 3ee3d36e9207a09fa3133c405f08a49a0d023f173ee5b4a47c047362aba56856

jobs:
  host-file-probe-linux:
    name: Host file probe Linux gates
    if: github.event_name == 'workflow_dispatch' && inputs.host_file_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          fetch-depth: 1
      - name: Native host probe adversarial tests
        run: sudo env "PATH=$PATH" python3 tests/test_host_file_access_probe.py

  baseline:
    name: Native deps + iOS 15 compile probe
    runs-on: macos-26-intel
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          fetch-depth: 1

      - name: Pin Xcode 26.2
        run: |
          set -euo pipefail
          sudo xcode-select -s "$DEVELOPER_DIR"
          test -d "$DEVELOPER_DIR"
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          test "$(printf '%s\n' "$xcode_version" | sed -n '1p')" = "$EXPECTED_XCODE"
          test "$(printf '%s\n' "$xcode_version" | sed -n '2p')" = "$EXPECTED_XCODE_BUILD"
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          printf 'iphoneos SDK %s\n' "$sdk"
          test "$sdk" = "$EXPECTED_IOS_SDK"

      - name: GPT-6.2, attachment and profile regression gates
        run: |
          set -euo pipefail
          python3 tests/test_gpt62_reasoning.py --static
          PATH="$(dirname "$(xcrun --find swiftc)"):$PATH" python3 tests/test_gpt62_reasoning.py --native
          python3 scripts/test_ios15_attachment_grid.py
          python3 scripts/test_ios15_file_access_profile.py

      # [T-host-file-probe] Opt-in only (workflow_dispatch input). Builds the
      # page and the helper for local inspection; nothing here installs,
      # signs for a device or loads a launch daemon.
      - name: Host file probe gates
        if: github.event_name == 'workflow_dispatch' && inputs.host_file_probe
        run: |
          set -euo pipefail
          sudo env "PATH=$PATH" python3 tests/test_host_file_access_probe.py
          sudo env "PATH=$PATH" python3 tests/test_root_probe_helper.py
          clang -std=c11 -Wall -Wextra -Werror -c src/ios/Diagnostics/HostFileAccessProbe.c -o "$RUNNER_TEMP/probe-off.o"
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos swiftc \
            -typecheck -parse-as-library -swift-version 5 \
            -target arm64-apple-ios15.0 -sdk "$sdk" \
            -module-cache-path "$RUNNER_TEMP/probe-module-cache" \
            -D DEBUG -D MINIS_HOST_FILE_PROBE \
            -Xcc -DMINIS_HOST_FILE_PROBE=1 \
            -import-objc-header src/ios/Diagnostics/HostFileAccessProbe.h \
            src/ios/Views/Settings/HostFileAccessProbeView.swift

      - name: SF Symbols compatibility gates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sf-symbols"
          python3 -m venv "$RUNNER_TEMP/sf-symbol-venv"
          "$RUNNER_TEMP/sf-symbol-venv/bin/pip" install --disable-pip-version-check \
            tree-sitter==0.25.2 tree-sitter-swift==0.7.3
          "$RUNNER_TEMP/sf-symbol-venv/bin/python" scripts/test_ios15_sf_symbols.py -v \
            2>&1 | tee "$RUNNER_TEMP/sf-symbols/audit.log"
          bash scripts/check_ios15_symbols.sh 2>&1 | tee "$RUNNER_TEMP/sf-symbols/native.log"

      - name: Init pinned iSH submodule only
        run: |
          set -euo pipefail
          git submodule update --init --recursive deps/ish
          sha="$(git -C deps/ish rev-parse HEAD)"
          printf 'deps/ish %s\n' "$sha"
          test "$sha" = "$EXPECTED_ISH"

      - name: Input prompt compatibility gates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/input-prompts"
          "$RUNNER_TEMP/sf-symbol-venv/bin/python" scripts/test_ios15_input_prompts.py -v \
            2>&1 | tee "$RUNNER_TEMP/input-prompts/audit.log"
          bash scripts/check_ios15_input_prompts.sh 2>&1 | tee "$RUNNER_TEMP/input-prompts/native.log"
          bash scripts/run_ios15_input_prompt_probe.sh "$RUNNER_TEMP/input-prompts/native-ui" \
            2>&1 | tee "$RUNNER_TEMP/input-prompts/probe.log"

      - name: Retry hit-test probe
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retry-probe"
          bash scripts/run_ios15_retry_probe.sh "$RUNNER_TEMP/retry-probe" \
            2>&1 | tee "$RUNNER_TEMP/retry-probe/probe.log"
          "$RUNNER_TEMP/sf-symbol-venv/bin/python" scripts/test_ios15_retry_hit.py -v \
            2>&1 | tee "$RUNNER_TEMP/retry-probe/contract.log"

      - name: Cache native iOS deps
        id: native-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps/libs
            deps/include
            deps/frameworks
            deps/resources
            deps/lame-build
            vendor/RealTimeCutVADLibrary/Frameworks
          key: native-macos26-xcode262-${{ env.EXPECTED_ISH }}-${{ hashFiles('deps/build_lame.sh','deps/build_ffmpeg.sh','deps/build_ish.sh','deps/prepare_alpine_rootfs.sh','deps/build_rclone_ios.sh','deps/build_vad_framework.sh','deps/rclone-mobile/go.sum') }}

      - name: Install native build tools
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          brew install llvm lld libarchive pkg-config meson
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          command -v meson
          command -v ninja
          test -x "$(brew --prefix llvm)/bin/clang"
          command -v ld.lld
          ld.lld --version | sed -n '1p'

      - name: Setup Go 1.25
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.25.0"
          cache-dependency-path: deps/rclone-mobile/go.sum

      - name: Provider customization template
        run: |
          set -euo pipefail
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: Build native iOS dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          command -v ld.lld
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh
          ./deps/build_vad_framework.sh
          ls -ld deps/libs deps/frameworks deps/resources vendor/RealTimeCutVADLibrary/Frameworks

      - name: Ensure local iOS 15 VAD framework
        run: |
          set -euo pipefail
          binary="vendor/RealTimeCutVADLibrary/Frameworks/RealTimeCutVADCXXLibrary.xcframework/ios-arm64/RealTimeCutVADCXXLibrary.framework/RealTimeCutVADCXXLibrary"
          if [ ! -f "$binary" ]; then
            ./deps/build_vad_framework.sh
          fi
          test -f "$binary"

      # [T-host-file-probe] Build only after the pinned iSH submodule and all
      # native frameworks are ready. The opt-in target remains unsigned and
      # separate from the ordinary m1 build used for release packaging.
      - name: Build host file probe app
        if: github.event_name == 'workflow_dispatch' && inputs.host_file_probe
        run: |
          set -euo pipefail
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/probe-dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            OTHER_CFLAGS="-DMINIS_HOST_FILE_PROBE=1" \
            OTHER_SWIFT_FLAGS="-DMINIS_HOST_FILE_PROBE" \
            build \
            > "$RUNNER_TEMP/probe-build.log" 2>&1
          python3 scripts/ios15_build_log.py "$RUNNER_TEMP/probe-build.log" --output-dir "$RUNNER_TEMP/probe-build"
          app="$RUNNER_TEMP/probe-dd/Build/Products/Debug-iphoneos/Minis.app"
          test -d "$app"
          python3 - "$app/Info.plist" <<'PY'
          import plistlib, sys
          from pathlib import Path
          info = plistlib.loads(Path(sys.argv[1]).read_bytes())
          assert info.get("CFBundleIdentifier") == "com.openminis.app", info.get("CFBundleIdentifier")
          assert info.get("MinimumOSVersion") == "15.0", info.get("MinimumOSVersion")
          print(f"probe app: {info['CFBundleIdentifier']} iOS {info['MinimumOSVersion']}")
          PY

      - name: Build iOS 15 root helper
        if: github.event_name == 'workflow_dispatch' && inputs.host_file_probe
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -arch arm64e -arch arm64 \
            -isysroot "$sdk" -miphoneos-version-min=15.0 \
            -O2 -Wall -Wextra -Werror \
            roothelper/main.c -o "$RUNNER_TEMP/minis-rootprobe"
          xcrun --sdk iphoneos lipo -info "$RUNNER_TEMP/minis-rootprobe"
          xcrun --sdk iphoneos otool -l "$RUNNER_TEMP/minis-rootprobe" | grep -A3 LC_BUILD_VERSION
          # Signature is applied only at package time by the installing user;
          # this step proves the binary builds for the device and prints its floor.
          echo "helper built, NOT signed, NOT installed"

      # Both read-only A/B apps must come from the same opt-in build so each
      # contains the same manually invoked positive-control and fixed-sample UI.
      # Packaging keeps their identities and entitlement profiles isolated.
      - name: Package host file probe A/B IPAs
        if: github.event_name == 'workflow_dispatch' && inputs.host_file_probe
        run: |
          set -euo pipefail
          python3 scripts/package_ios15_ipa.py \
            --derived-data "$RUNNER_TEMP/probe-dd" \
            --configuration Debug \
            --output-dir "$RUNNER_TEMP/probe-ipa-standard" \
            --entitlements scripts/ios15-trollstore.entitlements
          python3 scripts/package_ios15_ipa.py \
            --derived-data "$RUNNER_TEMP/probe-dd" \
            --configuration Debug \
            --output-dir "$RUNNER_TEMP/probe-ipa-broad-files" \
            --file-access-profile broad-files
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          expected = {
              "probe-ipa-standard": ("com.openminis.app", "standard"),
              "probe-ipa-broad-files": ("com.openminis.app.broadfiles", "broad-files"),
          }
          manifests = []
          for directory, (bundle_id, profile) in expected.items():
              manifest = json.loads((root / directory / "manifest.json").read_text())
              assert manifest["bundle_id"] == bundle_id, manifest
              assert manifest["minimum_os"] == "15.0", manifest
              assert manifest["file_access_profile"] == profile, manifest
              assert manifest["runtime_file_access_verified"] is False, manifest
              assert manifest["root_helper_included"] is False, manifest
              assert manifest["signed"] is True, manifest
              manifests.append(manifest)
          assert manifests[0]["source_app"] == manifests[1]["source_app"]
          print(json.dumps(manifests, indent=2))
          PY

      - name: Upload host file probe artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.host_file_probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minis-host-file-probe
          path: |
            ${{ runner.temp }}/probe-build.log
            ${{ runner.temp }}/probe-build/**
            ${{ runner.temp }}/probe-dd/Build/Products/Debug-iphoneos/Minis.app/**
            ${{ runner.temp }}/minis-rootprobe
          if-no-files-found: error
          retention-days: 14

      - name: Upload standard host file probe IPA
        if: github.event_name == 'workflow_dispatch' && inputs.host_file_probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minis-host-file-probe-standard-ipa
          path: |
            ${{ runner.temp }}/probe-ipa-standard/*.ipa
            ${{ runner.temp }}/probe-ipa-standard/manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload broad-files host file probe IPA
        if: github.event_name == 'workflow_dispatch' && inputs.host_file_probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minis-host-file-probe-broad-files-ipa
          path: |
            ${{ runner.temp }}/probe-ipa-broad-files/*.ipa
            ${{ runner.temp }}/probe-ipa-broad-files/manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Save native iOS deps cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps/libs
            deps/include
            deps/frameworks
            deps/resources
            deps/lame-build
            vendor/RealTimeCutVADLibrary/Frameworks
          key: native-macos26-xcode262-${{ env.EXPECTED_ISH }}-${{ hashFiles('deps/build_lame.sh','deps/build_ffmpeg.sh','deps/build_ish.sh','deps/prepare_alpine_rootfs.sh','deps/build_rclone_ios.sh','deps/build_vad_framework.sh','deps/rclone-mobile/go.sum') }}

      # The candidate is compiled by the audited m1 step below; avoid a
      # redundant second full Debug build for the isolated IPA dispatch.
      - name: Compile unchanged baseline
        if: github.event_name == 'workflow_dispatch' && !inputs.experimental_broad_files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m0"
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/m0/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            build \
            | tee "$RUNNER_TEMP/m0/xcodebuild.log"

      - name: Diagnostic parser regression tests
        run: |
          set -euo pipefail
          python3 scripts/test_ios15_build_log.py -v

      - name: Compatibility structural contract tests
        run: |
          set -euo pipefail
          python3 scripts/test_ios15_compat_contract.py -v
          xcrun swift "$GITHUB_WORKSPACE/src/ios/MinisTests/Standalone/NavRowPushAnimationTests.swift"

      - name: Automatic compaction budget native and source gates
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/sf-symbol-venv/bin/python" scripts/test_auto_compaction_budget.py \
            --runner "$(xcrun --find swiftc)" \
            --json "$RUNNER_TEMP/auto-compaction-budget.json"
          python3 scripts/test_keyword_snippet.py \
            --runner "$(xcrun --find swiftc)" \
            --json "$RUNNER_TEMP/keyword-snippet.json" || [ $? -eq 77 ]   # 77 = static-only: keywordSnippet() was replaced in 1.15
          "$RUNNER_TEMP/sf-symbol-venv/bin/python" scripts/test_ios15_hang_boundaries.py \
            --runner "$(xcrun --find swiftc)" \
            --json "$RUNNER_TEMP/hang-boundaries.json"
          "$RUNNER_TEMP/sf-symbol-venv/bin/python" scripts/test_stream_stall_guard.py \
            --runner "$(xcrun --find swiftc)" \
            --json "$RUNNER_TEMP/stream-stall-guard.json"

      - name: TrollStore IPA packager tests
        run: |
          set -euo pipefail
          python3 scripts/test_package_ios15_ipa.py -v
          python3 scripts/test_ios15_native_floor.py -v

      - name: Compatibility type-check smoke (15/16)
        run: |
          set -euo pipefail
          bash scripts/check_ios15_swiftui_compat.sh

      - name: Probe iOS 15 app target
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m1"
          set +e
          # Do not pass a global IPHONEOS_DEPLOYMENT_TARGET override: that
          # forced FileProvider (kept at 16.0) down to 15 and hid app errors.
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/m1/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            build \
            > "$RUNNER_TEMP/m1/xcodebuild.log" 2>&1
          status=$?
          set -e
          printf 'xcodebuild_exit=%s\n' "$status" | tee "$RUNNER_TEMP/m1/exit.txt"
          # Summarize with the tested extractor so source-comment echoes (lines
          # containing `error:` in /// docs or string literals) are not counted
          # as compiler diagnostics. The xcodebuild exit status stays the gate.
          python3 scripts/ios15_build_log.py "$RUNNER_TEMP/m1/xcodebuild.log" --output-dir "$RUNNER_TEMP/m1"
          test -s "$RUNNER_TEMP/m1/xcodebuild.log"
          # First probe is expected to fail. Keep the job red if xcodebuild failed
          # so the availability list is not mistaken for a passing iOS 15 build.
          exit "$status"

      - name: Responses API arguments native regression tests
        if: github.ref == 'refs/heads/fix/responses-api-args-recovery'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/responses-api-args"
          mkdir -p "$out"
          bash scripts/test_responses_tool_arguments.sh 2>&1 | tee "$out/swiftc-tests.log"

      - name: Package TrollStore IPA
        run: |
          set -euo pipefail
          python3 scripts/package_ios15_ipa.py \
            --derived-data "$RUNNER_TEMP/m1/DerivedData" \
            --configuration Debug \
            --output-dir "$RUNNER_TEMP/ipa" \
            --entitlements scripts/ios15-trollstore.entitlements
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ['RUNNER_TEMP'])/'ipa'/'manifest.json').read_text())
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload TrollStore IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minis-ios15-trollstore-ipa
          path: |
            ${{ runner.temp }}/ipa/*.ipa
            ${{ runner.temp }}/ipa/manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Package isolated experimental Minis Files IPA
        if: github.ref_name == 'fix/ios15-gpt62-attachments-broadfiles-20261120' || (github.event_name == 'workflow_dispatch' && inputs.experimental_broad_files)
        run: |
          set -euo pipefail
          python3 scripts/package_ios15_ipa.py \
            --derived-data "$RUNNER_TEMP/m1/DerivedData" \
            --configuration Debug \
            --output-dir "$RUNNER_TEMP/ipa-broadfiles" \
            --file-access-profile broad-files

      - name: Upload experimental Minis Files IPA
        if: github.ref_name == 'fix/ios15-gpt62-attachments-broadfiles-20261120' || (github.event_name == 'workflow_dispatch' && inputs.experimental_broad_files)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minis-ios15-trollstore-broadfiles-experimental
          path: |
            ${{ runner.temp }}/ipa-broadfiles/*.ipa
            ${{ runner.temp }}/ipa-broadfiles/manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Record evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m0" "$RUNNER_TEMP/m1"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          def sha256(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for chunk in iter(lambda: f.read(1024*1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          temp0=Path(os.environ['RUNNER_TEMP'])/'m0'
          temp1=Path(os.environ['RUNNER_TEMP'])/'m1'
          app=next(temp0.glob('DerivedData/Build/Products/Debug-iphoneos/Minis.app'), None)
          ev={
            'commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
            'xcode': subprocess.check_output(['xcodebuild','-version'], text=True).strip().splitlines(),
            'iphoneos_sdk': subprocess.check_output(['xcrun','--sdk','iphoneos','--show-sdk-version'], text=True).strip(),
            'swift': subprocess.check_output(['swift','--version'], text=True).strip().splitlines()[0],
            'ish': subprocess.check_output(['git','-C','deps/ish','rev-parse','HEAD'], text=True).strip(),
            'native_cache_hit': os.environ.get('CACHE_HIT','unknown'),
            'm1_log_bytes': (temp1/'xcodebuild.log').stat().st_size if (temp1/'xcodebuild.log').exists() else 0,
          }
          (temp1/'versions.json').write_text(json.dumps(ev, indent=2)+'\n')
          print(json.dumps(ev, indent=2))
          PY
        env:
          CACHE_HIT: ${{ steps.native-cache.outputs.cache-hit }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m1-ios15-probe
          path: |
            ${{ runner.temp }}/m0/xcodebuild.log
            ${{ runner.temp }}/m1/xcodebuild.log
