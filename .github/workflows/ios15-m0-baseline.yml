# M0 already passed on run 35228590640 (Xcode 26.2 / iOS SDK 26.2).
# Push to compat/ios15 now probes IPHONEOS_DEPLOYMENT_TARGET=15.0.
# Re-run the unchanged baseline with workflow_dispatch.
# Do not treat a started workflow as success.
name: ios15-m0-baseline

on:
  workflow_dispatch:
  push:
    branches: [compat/ios15]

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
  EXPECTED_XCODE: "Xcode 26.2"
  EXPECTED_XCODE_BUILD: "Build version 17C52"
  EXPECTED_IOS_SDK: "26.2"
  EXPECTED_ISH: "3f6384c70eefd1a370f121d3492a5f21f7767df9"

jobs:
  baseline:
    name: Native deps + iOS 15 compile probe
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          fetch-depth: 1

      - name: Pin Xcode 26.2
        run: |
          set -euo pipefail
          sudo xcode-select -s "$DEVELOPER_DIR"
          test -d "$DEVELOPER_DIR"
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          test "$(printf '%s\n' "$xcode_version" | sed -n '1p')" = "$EXPECTED_XCODE"
          test "$(printf '%s\n' "$xcode_version" | sed -n '2p')" = "$EXPECTED_XCODE_BUILD"
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          printf 'iphoneos SDK %s\n' "$sdk"
          test "$sdk" = "$EXPECTED_IOS_SDK"

      - name: Init pinned iSH submodule only
        run: |
          set -euo pipefail
          git submodule update --init --recursive deps/ish
          sha="$(git -C deps/ish rev-parse HEAD)"
          printf 'deps/ish %s\n' "$sha"
          test "$sha" = "$EXPECTED_ISH"

      - name: Cache native iOS deps
        id: native-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps/libs
            deps/include
            deps/frameworks
            deps/resources
            deps/lame-build
          key: native-macos26-xcode262-${{ env.EXPECTED_ISH }}-${{ hashFiles('deps/build_lame.sh','deps/build_ffmpeg.sh','deps/build_ish.sh','deps/prepare_alpine_rootfs.sh','deps/build_rclone_ios.sh','deps/rclone-mobile/go.sum') }}

      - name: Install native build tools
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          brew install llvm lld libarchive pkg-config meson
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:$PATH"
          command -v meson
          command -v ninja
          test -x /opt/homebrew/opt/llvm/bin/clang
          command -v ld.lld
          ld.lld --version | sed -n '1p'

      - name: Setup Go 1.25
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.25.0"
          cache-dependency-path: deps/rclone-mobile/go.sum

      - name: Provider customization template
        run: |
          set -euo pipefail
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: Build native iOS dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:$PATH"
          command -v ld.lld
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh
          ls -ld deps/libs deps/frameworks deps/resources

      - name: Compile unchanged baseline
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m0"
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/m0/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            build \
            | tee "$RUNNER_TEMP/m0/xcodebuild.log"

      - name: Probe iOS 15 app target
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m1"
          set +e
          # Do not pass a global IPHONEOS_DEPLOYMENT_TARGET override: that
          # forced FileProvider (kept at 16.0) down to 15 and hid app errors.
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/m1/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            build \
            > "$RUNNER_TEMP/m1/xcodebuild.log" 2>&1
          status=$?
          set -e
          printf 'xcodebuild_exit=%s\n' "$status" | tee "$RUNNER_TEMP/m1/exit.txt"
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re
          log=Path(os.environ['RUNNER_TEMP'])/'m1'/'xcodebuild.log'
          text=log.read_text(errors='replace')
          errors=[ln for ln in text.splitlines() if ' error:' in ln or ln.startswith('error:')]
          Path(os.environ['RUNNER_TEMP']+'/m1/errors.txt').write_text('\n'.join(errors)+('\n' if errors else ''))
          summary={
            'log_bytes': log.stat().st_size,
            'error_lines': len(errors),
            'build_succeeded': '** BUILD SUCCEEDED **' in text,
            'build_failed': '** BUILD FAILED **' in text,
            'first_errors': errors[:80],
          }
          Path(os.environ['RUNNER_TEMP']+'/m1/summary.json').write_text(json.dumps(summary, indent=2)+'\n')
          print(json.dumps({k:summary[k] for k in summary if k!='first_errors'}, indent=2))
          print('\n'.join(errors[:40]))
          PY
          test -s "$RUNNER_TEMP/m1/xcodebuild.log"
          # First probe is expected to fail. Keep the job red if xcodebuild failed
          # so the availability list is not mistaken for a passing iOS 15 build.
          exit "$status"

      - name: Record evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m0" "$RUNNER_TEMP/m1"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          def sha256(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for chunk in iter(lambda: f.read(1024*1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          temp0=Path(os.environ['RUNNER_TEMP'])/'m0'
          temp1=Path(os.environ['RUNNER_TEMP'])/'m1'
          app=next(temp0.glob('DerivedData/Build/Products/Debug-iphoneos/Minis.app'), None)
          ev={
            'commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
            'xcode': subprocess.check_output(['xcodebuild','-version'], text=True).strip().splitlines(),
            'iphoneos_sdk': subprocess.check_output(['xcrun','--sdk','iphoneos','--show-sdk-version'], text=True).strip(),
            'swift': subprocess.check_output(['swift','--version'], text=True).strip().splitlines()[0],
            'ish': subprocess.check_output(['git','-C','deps/ish','rev-parse','HEAD'], text=True).strip(),
            'native_cache_hit': os.environ.get('CACHE_HIT','unknown'),
            'm1_log_bytes': (temp1/'xcodebuild.log').stat().st_size if (temp1/'xcodebuild.log').exists() else 0,
          }
          (temp1/'versions.json').write_text(json.dumps(ev, indent=2)+'\n')
          print(json.dumps(ev, indent=2))
          PY
        env:
          CACHE_HIT: ${{ steps.native-cache.outputs.cache-hit }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m1-ios15-probe
          path: |
            ${{ runner.temp }}/m0/xcodebuild.log
            ${{ runner.temp }}/m1/xcodebuild.log
            ${{ runner.temp }}/m1/errors.txt
            ${{ runner.temp }}/m1/summary.json
            ${{ runner.temp }}/m1/versions.json
            ${{ runner.temp }}/m1/exit.txt
          if-no-files-found: warn
          retention-days: 14
