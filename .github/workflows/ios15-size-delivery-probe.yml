name: ios15-size-delivery-probe

on:
  workflow_dispatch:
  push:
    branches: [diagnostics/ios15-tool-card-geometry]
    paths:
      - .github/workflows/ios15-size-delivery-probe.yml
      - scripts/prepare_ios15_size_delivery_probe.py
      - scripts/test_ios15_size_delivery_probe.py
      - scripts/run_ios15_size_delivery_probe.sh
      - scripts/ios15-size-delivery-probe/**
      - src/ios/Shared/LegacyHostingContent.swift

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

jobs:
  delivery-contract:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          submodules: false
      - name: Verify source-copy invariants
        run: python3 scripts/test_ios15_size_delivery_probe.py -v
      - name: Run production notification contract on pinned simulator
        run: |
          set -euo pipefail
          bash scripts/run_ios15_size_delivery_probe.sh "$RUNNER_TEMP/size-delivery-probe" \
            2>&1 | tee "$RUNNER_TEMP/size-delivery-probe-run.log"
      - name: Preserve evidence even when baseline is red
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios15-size-delivery-probe
          path: |
            ${{ runner.temp }}/size-delivery-probe
            ${{ runner.temp }}/size-delivery-probe-run.log
          if-no-files-found: warn
          retention-days: 7
