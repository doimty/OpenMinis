name: ios15-fallback-layout-probe

on:
  workflow_dispatch:
  push:
    branches: [diagnostics/ios15-layout-586e3f8]
    paths:
      - .github/workflows/ios15-layout-probe.yml
      - scripts/run_ios15_layout_probe.sh
      - scripts/ios15-layout-probe/**
      - src/ios/Shared/LegacyHostingContent.swift
      - src/ios/Shared/NSTextContainerSetSizeGuard.*
      - src/ios/Views/Chat/SelectableMarkdownView.swift

permissions:
  contents: read

jobs:
  native-probe:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
          fetch-depth: 1
      - name: Verify pinned Xcode and simulator SDK
        run: |
          set -euo pipefail
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.2'
          test "$(xcodebuild -version | sed -n '2p')" = 'Build version 17C52'
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = '26.2'
          xcodebuild -version
      - name: Run native fallback sizing matrix
        run: bash scripts/run_ios15_layout_probe.sh "$RUNNER_TEMP/layout-probe"
      - name: Preserve probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios15-fallback-layout-probe
          path: ${{ runner.temp }}/layout-probe
          if-no-files-found: error
          retention-days: 14
