name: AOJIT busybox pilot (record one image)

# Stage 2 of AOJIT: prove we can record an AOT image for OUR kernel abi and OUR
# rootfs, then assemble it for iOS. This job does NOT change the app and does not
# ship anything; it uploads the .S/.o plus the recording log for evaluation.
#
# The CLI's -r mounts a real directory (realfs); a fakefs rootfs (data/ + meta.db)
# needs -f. The AOJIT suite has to be inside the real rootfs before fakefsify,
# because files copied into data/ are invisible without a meta.db entry.

on:
  push:
    branches: [feat/aojit-pilot-20261022]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record-busybox:
    name: Record and assemble the busybox image
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout with the pinned kernel
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Assert the kernel pin
        run: |
          set -euo pipefail
          test "$(git -C deps/ish rev-parse HEAD)" = "c5c264da19148512167aa493d7bd4e50aae1b74e"

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install meson ninja libarchive pkg-config lld llvm
          echo "/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"

      - name: Clamp the guest hostname to the utsname field
        run: |
          set -euo pipefail
          # do_uname() copies the host nodename into a 65-byte guest field; GitHub's
          # macOS hostname is longer, so fortify aborts inside sys_uname.
          sed -i '' 's|strcpy(uts->hostname, hostname);|snprintf(uts->hostname, sizeof(uts->hostname), "%s", hostname);|' deps/ish/kernel/uname.c
          grep -n 'uts->hostname' deps/ish/kernel/uname.c

      - name: Build the ish CLI with the JIT enabled
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:$PATH"
          cd deps/ish
          meson setup build-cli \
            --buildtype=release \
            -Dkernel=ish \
            -Dengine=asbestos \
            -Dguest_arch=arm64 \
            -Djit=true \
            -Dc_args=-U_FORTIFY_SOURCE
          ninja -C build-cli ish

      - name: Install the recorder's Python deps
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet tqdm || python3 -m pip install --user --quiet --break-system-packages tqdm
          python3 -c 'import tqdm; print("tqdm", tqdm.__version__)'

      - name: Prepare the arm64 rootfs
        run: |
          set -euo pipefail
          ./deps/prepare_alpine_rootfs.sh
          ls deps/resources
          ls deps/.cache

      - name: Stage the AOJIT suite into a real rootfs and fakefsify it
        run: |
          set -euo pipefail
          TARBALL="$(ls deps/.cache/*minirootfs*-aarch64.tar.gz | head -1)"
          test -n "$TARBALL"
          rm -rf work
          mkdir -p work/rootfs
          tar -xzf "$TARBALL" -C work/rootfs
          mkdir -p work/rootfs/tmp/aojit
          cp -R deps/ish/benchmark/aojit/guest/. work/rootfs/tmp/aojit/
          cp deps/ish/benchmark/aojit/images.json work/rootfs/tmp/aojit/
          ls work/rootfs/tmp/aojit
          tar -czf work/staged.tar.gz -C work/rootfs .
          deps/ish/build-native/tools/fakefsify work/staged.tar.gz work/fakefs
          ls -la work/fakefs

      - name: Sign the CLI so the JIT may allocate executable memory
        run: |
          set -euo pipefail
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '  <key>com.apple.security.cs.allow-jit</key><true/>' \
            '  <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>' \
            '  <key>com.apple.security.cs.disable-library-validation</key><true/>' \
            '</dict></plist>' > /tmp/jit.plist
          codesign --force --sign - --entitlements /tmp/jit.plist --options runtime deps/ish/build-cli/ish
          codesign -d --entitlements - deps/ish/build-cli/ish 2>&1 | head -12

      - name: Run the suite setup inside the fakefs
        continue-on-error: true
        run: |
          set +e
          deps/ish/build-cli/ish -f "$PWD/work/fakefs" /bin/sh -c 'echo HELLO; cat /etc/alpine-release'
          echo "exit=$?"
          ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | tail -5
          f=$(ls -t ~/Library/Logs/DiagnosticReports/ish* 2>/dev/null | head -1)
          if [ -n "$f" ]; then echo "== crash report"; head -60 "$f"; fi
          true

      - name: Capture a backtrace of the crash
        continue-on-error: true
        run: |
          set +e
          lldb --batch \
            -o 'settings set target.env-vars TERM=dumb' \
            -o run \
            -o 'thread backtrace all' \
            -o quit -- deps/ish/build-cli/ish -f "$PWD/work/fakefs" /bin/sh -c 'echo HELLO' 2>&1 | tail -70
          true

      - name: Run the guest suite setup
        continue-on-error: true
        run: |
          set -euo pipefail
          deps/ish/build-cli/ish -f "$PWD/work/fakefs" /bin/sh /tmp/aojit/setup.sh

      - name: Give the workload the python trees it scans
        continue-on-error: true
        run: |
          set +e
          deps/ish/build-cli/ish -f "$PWD/work/fakefs" /bin/sh -c '
            printf "nameserver 1.1.1.1\n" > /etc/resolv.conf
            if apk add --no-cache python3 > /tmp/apk.log 2>&1; then
              echo "python3 installed"
            else
              echo "apk failed, trimming the python scans from the workload"
              sed -i "/usr\/lib\/python3.12/d" /tmp/aojit/busybox/busybox_train.sh
            fi
            tail -3 /tmp/apk.log
            ls -d /usr/lib/python3* 2>/dev/null
          '
          true

      - name: Make a wrapper that maps -r to -f
        run: |
          set -euo pipefail
          mkdir -p out
          printf '%s\n' \
            '#!/bin/bash' \
            'args=()' \
            'while [ $# -gt 0 ]; do' \
            '  if [ "$1" = "-r" ]; then args+=("-f"); else args+=("$1"); fi' \
            '  shift' \
            'done' \
            'exec "${REAL_ISH:?}" "${args[@]}"' > out/ish-f.sh
          chmod +x out/ish-f.sh
          head -3 out/ish-f.sh
          echo "REAL_ISH=$PWD/deps/ish/build-cli/ish" >> "$GITHUB_ENV"

      - name: Record the busybox image for this abi
        run: |
          set -euo pipefail
          REAL_ISH="$PWD/deps/ish/build-cli/ish" \
            RECORDING="$PWD/out/busybox_rec.jsonl" \
            sh deps/ish/tools/jit_aot/record.sh \
              out/ish-f.sh "$PWD/work/fakefs" \
              /tmp/aojit/busybox/busybox_train.sh \
              out/aot_busybox.S busybox
          ls -la out

      - name: Assemble the image for iOS
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -O2 \
            -c out/aot_busybox.S -o out/aot_busybox_ios.o
          file out/aot_busybox_ios.o
          ls -la out

      - name: Note the ABI that produced the image
        if: always()
        run: |
          set +e
          grep -o 'jit_abi[^,)]*' deps/ish/asbestos/guest-arm64/jit.c | head -5
          true

      - name: Upload the image and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aojit-busybox-pilot
          path: |
            out/**
            work/fakefs/meta.db
          if-no-files-found: warn
          retention-days: 14
